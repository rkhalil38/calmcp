[package]
name = "calmcp"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
env_logger = "0.11.11"
http = "1.5.0"
hyper-rustls = "0.27.10"
hyper-util = "0.1.21"
jiff = { version = "1.0.1", features = ["serde"] }
libdav = "0.11.2"
log = "0.4.35"
rmcp = { version = "3.11.0", features = ["server", "transport-streamable-http-server"] }
serde = "1.0.229"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
tower-http = { version = "0.7.1", features = ["auth"] }
subtle = "2"
