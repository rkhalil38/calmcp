# Local Radicale CalDAV server for testing calmcp.
# Credentials: test / test (see ./users). Not for production use.
services:
  radicale:
    image: tomsquest/docker-radicale:3.5.4.0
    container_name: calmcp-radicale
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./config:/config/config:ro
      - ./users:/config/users:ro
      - radicale-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:5232/.web/"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  radicale-data:
